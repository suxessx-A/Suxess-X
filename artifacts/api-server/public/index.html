<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X Momentum</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f1a;
      color: #f0f0f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #1a1a2e;
      border: 1px solid rgba(212, 160, 23, 0.3);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 420px;
      width: 90%;
      text-align: center;
    }

    .logo {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #d4a017;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 10px;
    }

    p {
      font-size: 15px;
      color: rgba(255,255,255,0.55);
      line-height: 1.6;
      margin-bottom: 36px;
    }

    button {
      background: #d4a017;
      color: #0f0f1a;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
      width: 100%;
    }

    button:hover { opacity: 0.88; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .result {
      margin-top: 24px;
      padding: 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      display: none;
    }

    .result.ok {
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.3);
      color: #4ade80;
    }

    .result.error {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Amplify-X</div>
    <h1>X Momentum</h1>
    <p>AI executive coaching for professional women. Captain vs Passenger methodology.</p>
    <button id="checkBtn" onclick="checkApi()">Check API</button>
    <div class="result" id="result"></div>
  </div>

  <script>
    async function checkApi() {
      const btn = document.getElementById('checkBtn');
      const result = document.getElementById('result');
      btn.disabled = true;
      btn.textContent = 'Checking…';
      result.style.display = 'none';
      result.className = 'result';
      try {
        const res = await fetch('/health');
        const data = await res.json();
        result.textContent = '✓ API online — ' + JSON.stringify(data);
        result.classList.add('ok');
      } catch (err) {
        result.textContent = '✗ API unreachable — ' + err.message;
        result.classList.add('error');
      } finally {
        result.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Check API';
      }
    }
  </script>
</body>
</html>
